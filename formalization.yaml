# yaml-language-server: $schema=https://raw.githubusercontent.com/mathlib-initiative/formalization.yaml/main/schema/formalization.schema.json
version: "v0.4"

project:
  name: "Iwaniec's linear sieve at the sifting limit and Jacobsthal's problem"
  description: >-
    A Lean 4 formalization of H. Iwaniec, "On the error term in the linear
    sieve" (Acta Arith. 19, 1971) and "On the problem of Jacobsthal"
    (Demonstratio Math. 11, 1978). The headline result is Iwaniec's bound for
    Jacobsthal's problem: if m consecutive integers are each divisible by one
    of r ≥ 2 given primes, then m ≤ C (r log r)² for an absolute constant C.
    More strongly, every interval of length c ∏ (1 − 1/q)⁻¹ r² log r contains
    at least r² integers coprime to r given primes. Both the Theorem and the
    Corollary of the 1978 paper are proved, together with its Lemma 1 (the
    shifted sieve, both bounds) and Lemma 2. The 1971 paper is formalized in
    full: the Rosser–Iwaniec linear sieve at the sifting limit with general
    modulus k and arbitrary finite sequences (§2); the sieve functions f, F
    and the majorants 𝔐, 𝔚 defined by delay-differential equations,
    including F(3) = 2e^γ − 3 and the asymptotics of 𝔐 (§3); the main term
    with error O(1/log y) and support of size O(y / log² y) (§4, Theorems 4
    and 5); and Theorem 1 with its Corollary, Theorem 2 (C₀(r) ≪ r² log² r)
    and Theorem 3 (§5). The prime number theorem with de la Vallée Poussin
    error term and Mertens' theorems come from a vendored copy of
    PrimeNumberTheoremAnd.
  authors:
    - "Jason Davies"
  license: "Apache-2.0"
  responsible_maintainers:
    - "Jason Davies"

