name = "iwaniec_linear_sieve"
version = "0.1.0"
defaultTargets = ["IwaniecLinearSieve", "Challenge", "Solution"]

[leanOptions]
autoImplicit = false

[[require]]
name = "mathlib"
git = "https://github.com/leanprover-community/mathlib4.git"
rev = "v4.35.0"

[[require]]
name = "strong_pnt"
path = "vendor/strong-pnt"

[[lean_lib]]
name = "IwaniecLinearSieve"

[[lean_lib]]
name = "Challenge"
roots = ["Challenge"]

[[lean_lib]]
name = "Solution"
roots = ["Solution"]
