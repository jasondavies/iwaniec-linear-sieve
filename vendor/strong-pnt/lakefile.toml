name = "strong_pnt"
version = "0.1.0"
defaultTargets = ["IwaniecLinearSieveVendor"]

[leanOptions]
autoImplicit = false
relaxedAutoImplicit = false

[[require]]
name = "mathlib"
git = "https://github.com/leanprover-community/mathlib4.git"
rev = "v4.35.0"

[[lean_lib]]
name = "IwaniecLinearSieveVendor"
roots = ["IwaniecLinearSieveVendor.PrimeNumberTheoremAnd.StrongPNT",
  "IwaniecLinearSieveVendor.PrimeNumberTheoremAnd.IEANTN.Mertens"]
globs = ["IwaniecLinearSieveVendor.+"]
