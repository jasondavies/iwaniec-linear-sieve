name = "strong_pnt"
version = "0.1.0"
defaultTargets = ["PrimeNumberTheoremAnd"]

[leanOptions]
autoImplicit = false
relaxedAutoImplicit = false

[[require]]
name = "mathlib"
git = "https://github.com/leanprover-community/mathlib4.git"
rev = "v4.35.0"

[[lean_lib]]
name = "Architect"

[[lean_lib]]
name = "PrimeNumberTheoremAnd"
roots = ["PrimeNumberTheoremAnd.StrongPNT", "PrimeNumberTheoremAnd.IEANTN.Mertens"]
globs = ["PrimeNumberTheoremAnd.+"]
