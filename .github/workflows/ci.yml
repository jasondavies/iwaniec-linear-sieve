name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: leanprover/lean-action@v1
        with:
          use-mathlib-cache: true
      - name: Audit axioms
        run: lake env lean scripts/CheckAxioms.lean
